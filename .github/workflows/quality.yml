name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  UV_NO_PROGRESS: "1"

jobs:
  quality:
    name: Core quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          check-latest: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked development environment
        run: uv sync --extra dev --locked
      - name: Require CMake toolchain
        shell: pwsh
        run: |
          cmake --version
          ctest --version
          ninja --version
          $compiler = Get-Command cc,gcc,clang,cl -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $compiler) { throw "A C compiler is required." }
          Write-Output "C compiler: $($compiler.Source)"
      - name: Check formatting
        run: uv run --frozen ruff format --check .
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Type check
        run: uv run --frozen mypy
      - name: Run cross-platform core tests
        run: >-
          uv run --frozen pytest
          --junitxml=core-test-results.xml
          tests/unit
          tests/integration
          tests/golden_projects
          tests/acceptance/test_cmake_disposable_release_workflow.py
          tests/acceptance/test_fastapi_v1_v2_equivalence.py
          tests/acceptance/test_four_combination_workflow.py
          tests/acceptance/test_failed_release_recovery_workflow.py
      - name: Annotate failed core tests
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath core-test-results.xml)) { exit 0 }
          [xml]$report = Get-Content -Raw -LiteralPath core-test-results.xml
          $failedTests = @($report.SelectNodes('//testcase[failure or error]'))
          foreach ($testCase in $failedTests) {
            $identifier = "$($testCase.GetAttribute('classname')).$($testCase.GetAttribute('name'))"
            $failureNode = @($testCase.SelectNodes('failure|error'))[0]
            $trace = $failureNode.InnerText
            $trace = $trace.Substring([Math]::Max(0, $trace.Length - 1800))
            $details = "$identifier`n$trace"
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=pytest failure::$details"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- ``$identifier``"
          }

  release-matrix:
    name: Four real release combinations (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.1-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      SCAFFOLD_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          check-latest: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked development environment
        run: uv sync --extra dev --locked
      - name: Require Docker engine and Compose
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version
      - name: Run M-01 through M-04 release acceptance
        run: >-
          uv run --frozen pytest
          --junitxml=release-test-results.xml
          tests/acceptance/test_disposable_release_workflow.py
          tests/acceptance/test_postgres_disposable_release_workflow.py
          tests/acceptance/test_docker_disposable_release_workflow.py
      - name: Annotate failed release tests
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath release-test-results.xml)) { exit 0 }
          [xml]$report = Get-Content -Raw -LiteralPath release-test-results.xml
          $failedTests = @($report.SelectNodes('//testcase[failure or error]'))
          foreach ($testCase in $failedTests) {
            $identifier = "$($testCase.GetAttribute('classname')).$($testCase.GetAttribute('name'))"
            $failureNode = @($testCase.SelectNodes('failure|error'))[0]
            $trace = $failureNode.InnerText
            $trace = $trace.Substring([Math]::Max(0, $trace.Length - 1800))
            $details = "$identifier`n$trace"
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=pytest failure::$details"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- ``$identifier``"
          }
