name: correct-v2-rc1-metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/correct-v2-rc1-metadata.yml

permissions:
  contents: read

jobs:
  correct:
    name: Mark v2.0.0-rc.1 as prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Correct release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit v2.0.0-rc.1 --prerelease
