services:
  database:
    image: postgres:18.1-bookworm
    environment:
      POSTGRES_DB: application
      POSTGRES_USER: application
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://application:$POSTGRES_PASSWORD@database:5432/application
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  application:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+asyncpg://application:$POSTGRES_PASSWORD@database:5432/application
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

volumes:
  postgres_data:
