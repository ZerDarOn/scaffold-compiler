name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Check formatting
        shell: pwsh
        run: |
          $unformatted = @(gofmt -l calculator.go calculator_test.go main.go)
          if ($unformatted.Count -ne 0) { throw "Unformatted Go files: $unformatted" }
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
  build-and-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Check formatting
        shell: pwsh
        run: |
          $unformatted = @(gofmt -l calculator.go calculator_test.go main.go)
          if ($unformatted.Count -ne 0) { throw "Unformatted Go files: $unformatted" }
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
